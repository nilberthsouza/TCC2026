<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integração Python e OpenDSS</title>

<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background:#ffffff;
        margin:0;
        padding:30px;
    }

    .container{
        max-width:1000px;
        margin:auto;
    }

    h2{
        text-align:center;
        margin-bottom:20px;
    }

    svg{
        width:100%;
        height:auto;
    }

    .box{
        fill:#f8f9fa;
        stroke:#2c3e50;
        stroke-width:2;
    }

    .title{
        font-size:18px;
        font-weight:bold;
        text-anchor:middle;
        fill:#2c3e50;
    }

    .text{
        font-size:14px;
        text-anchor:middle;
        fill:#444;
    }

    .small{
        font-size:13px;
        fill:#666;
    }

    .caption{
        text-align:center;
        margin-top:15px;
        font-size:15px;
    }
</style>
</head>
<body>

<div class="container">

<svg viewBox="0 0 1000 850">

    <!-- Definição da seta -->
    <defs>
        <marker id="arrowhead"
                markerWidth="10"
                markerHeight="7"
                refX="10"
                refY="3.5"
                orient="auto">
            <polygon points="0 0, 10 3.5, 0 7"
                     fill="#2c3e50"/>
        </marker>
    </defs>

    <!-- ================================================= -->
    <!-- BLOCO 1 -->
    <!-- ================================================= -->

    <rect class="box" x="250" y="20" width="500" height="90" rx="12"/>

    <image href="python.png"
           x="275"
           y="38"
           width="50"
           height="50"/>

    <text class="title" x="520" y="55">
        Script Python
    </text>

    <text class="text" x="520" y="82">
        py_dss_interface
    </text>

    <!-- Seta -->
    <line x1="500"
          y1="110"
          x2="500"
          y2="155"
          stroke="#2c3e50"
          stroke-width="2.5"
          marker-end="url(#arrowhead)"/>

    <text class="small" x="590" y="140">
        dss.text("compile arquivo.dss")
    </text>

    <!-- ================================================= -->
    <!-- BLOCO 2 -->
    <!-- ================================================= -->

    <rect class="box" x="250" y="160" width="500" height="100" rx="12"/>

    <image href="opendss.png"
           x="275"
           y="185"
           width="50"
           height="50"/>

    <text class="title" x="520" y="200">
        Compilação do Circuito
    </text>

    <text class="text" x="520" y="228">
        Carregamento da topologia e parâmetros
    </text>

    <!-- Seta -->
    <line x1="500"
          y1="260"
          x2="500"
          y2="305"
          stroke="#2c3e50"
          stroke-width="2.5"
          marker-end="url(#arrowhead)"/>

    <!-- ================================================= -->
    <!-- BLOCO 3 -->
    <!-- ================================================= -->

    <rect class="box" x="250" y="310" width="500" height="110" rx="12"/>

    <image href="python.png"
           x="275"
           y="340"
           width="50"
           height="50"/>

    <text class="title" x="520" y="350">
        Configuração da Simulação
    </text>

    <text class="text" x="520" y="378">
        Inserção de faltas
    </text>

    <text class="text" x="520" y="398">
        Seleção de barras e elementos
    </text>

    <!-- Seta -->
    <line x1="500"
          y1="420"
          x2="500"
          y2="465"
          stroke="#2c3e50"
          stroke-width="2.5"
          marker-end="url(#arrowhead)"/>

    <text class="small" x="600" y="450">
        dss.solution.solve()
    </text>

    <!-- ================================================= -->
    <!-- BLOCO 4 -->
    <!-- ================================================= -->

    <rect class="box" x="250" y="470" width="500" height="110" rx="12"/>

    <image href="opendss.png"
           x="275"
           y="500"
           width="50"
           height="50"/>

    <text class="title" x="520" y="510">
        Solver OpenDSS
    </text>

    <text class="text" x="520" y="538">
        Fluxo de carga
    </text>

    <text class="text" x="520" y="558">
        Simulação de curto-circuito
    </text>

    <!-- Seta -->
    <line x1="500"
          y1="580"
          x2="500"
          y2="625"
          stroke="#2c3e50"
          stroke-width="2.5"
          marker-end="url(#arrowhead)"/>

    <text class="small" x="615" y="610">
        dss.bus / dss.cktelement
    </text>

    <!-- ================================================= -->
    <!-- BLOCO 5 -->
    <!-- ================================================= -->

    <rect class="box" x="250" y="630" width="500" height="140" rx="12"/>

    <image href="python.png"
           x="275"
           y="675"
           width="50"
           height="50"/>

    <text class="title" x="520" y="675">
        Extração e Processamento dos Resultados
    </text>

    <text class="text" x="520" y="705">
        Fasores de tensão
    </text>

    <text class="text" x="520" y="730">
        Fasores de corrente
    </text>

    <text class="text" x="520" y="755">
        Análise e armazenamento dos dados
    </text>

</svg>


</body>
</html>
